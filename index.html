<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Little Garden</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: #f7efd9;
      color: #4d5f45;
    }

    header {
      text-align: center;
      padding: 24px 15px 16px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      color: #55734d;
    }

    header p {
      margin: 8px 0 0;
      color: #8a765c;
      font-style: italic;
    }

    /* THE GARDEN */

    .garden {
      position: relative;
      width: calc(100% - 30px);
      max-width: 1100px;
      height: 560px;
      margin: 0 auto;
      overflow: hidden;

      background:
        linear-gradient(
          to bottom,
          #cce8ed 0%,
          #dff0dc 28%,
          #a9c985 28%,
          #91b86f 100%
        );

      border-radius: 12px;
      border: 8px solid #d8c59d;
      box-shadow: 0 8px 20px rgba(80, 70, 45, 0.15);
    }

    /* distant greenery */

    .background-trees {
      position: absolute;
      top: 90px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 75px;
      letter-spacing: 30px;
      opacity: 0.75;
      pointer-events: none;
    }

    /* garden grass */

    .grass {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 5%;
      height: 63%;
      background: #91b86f;
      border-radius: 45% 45% 8% 8%;
      box-shadow: inset 0 12px 20px rgba(255,255,255,0.12);
    }

    /* boundary */

    .boundary {
      position: absolute;
      inset: 7%;
      border: 5px solid #c29b69;
      border-radius: 12px;
      pointer-events: none;
    }

    /* planting area */

    #plantingArea {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 9%;
      top: 32%;
      cursor: crosshair;
    }

    /* plants */

    .plant {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 38px;
      cursor: pointer;
      user-select: none;
      animation: appear 0.4s ease;
    }

    @keyframes appear {
      from {
        transform: translate(-50%, -50%) scale(0);
      }

      to {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* controls */

    .controls {
      width: calc(100% - 30px);
      max-width: 900px;
      margin: 20px auto;
      padding: 18px;
      background: #fffaf0;
      border: 2px solid #e2d2ad;
      border-radius: 16px;
      text-align: center;
    }

    .controls h2 {
      margin: 0 0 8px;
      color: #55734d;
    }

    .controls p {
      margin: 6px 0 15px;
    }

    button {
      padding: 10px 15px;
      margin: 4px;
      border: 2px solid #d2bd91;
      border-radius: 12px;
      background: #fdf6e5;
      color: #4d5f45;
      font-family: Georgia, serif;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #e6efd9;
    }

    button.selected {
      background: #dcebd1;
      border-color: #789763;
    }

    #message {
      margin-top: 12px;
      min-height: 22px;
      color: #607d52;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 10px 15px 30px;
      color: #98866b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌿 The Little Garden</h1>
    <p>A little place to grow at your own pace.</p>
  </header>

  <main>

    <section class="garden">

      <div class="background-trees">
        🌳 🌳 🌳
      </div>

      <div class="grass"></div>

      <div class="boundary"></div>

      <div id="plantingArea"></div>

    </section>

    <section class="controls">

      <h2>🌱 Choose something to plant</h2>

      <p>
        Choose a plant, then tap anywhere in your garden.
      </p>

      <button onclick="selectPlant('🌷', 'Tulip', this)">
        🌷 Tulip
      </button>

      <button onclick="selectPlant('🌻', 'Sunflower', this)">
        🌻 Sunflower
      </button>

      <button onclick="selectPlant('🌹', 'Rose', this)">
        🌹 Rose
      </button>

      <button onclick="selectPlant('🌼', 'Daisy', this)">
        🌼 Daisy
      </button>

      <button onclick="selectPlant('🌿', 'Lavender', this)">
        🌿 Lavender
      </button>

      <div id="message">
        Choose a plant to begin.
      </div>

    </section>

  </main>

  <footer>
    The Little Garden 🌱
  </footer>


  <script>

    let selectedPlant = null;
    let selectedName = null;

    function selectPlant(plant, name, button) {

      selectedPlant = plant;
      selectedName = name;

      document
        .querySelectorAll("button")
        .forEach(function(button) {
          button.classList.remove("selected");
        });

      button.classList.add("selected");

      document.getElementById("message").textContent =
        "Now tap somewhere in your garden to plant a " + name + ".";
    }


    document
      .getElementById("plantingArea")
      .addEventListener("click", function(event) {

        if (!selectedPlant) {

          document.getElementById("message").textContent =
            "Choose a plant first.";

          return;
        }

        const rect = this.getBoundingClientRect();

        const x =
          ((event.clientX - rect.left) / rect.width) * 100;

        const y =
          ((event.clientY - rect.top) / rect.height) * 100;

        const plant = document.createElement("div");

        plant.className = "plant";

        plant.textContent = selectedPlant;

        plant.style.left = x + "%";
        plant.style.top = y + "%";

        plant.title = selectedName;

        this.appendChild(plant);

        document.getElementById("message").textContent =
          "You planted a " + selectedName + "! 🌱";
      });

  </script>

</body>
</html>
